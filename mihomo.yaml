    url: "https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/mihomo/wildberries.yaml"
    path: ./rule-providers/wildberries.yaml
    interval: 86400

rules:
  # ChatGPT/Codex 核心域名优先于广告和隐私规则。
  - RULE-SET,openai_core,🤖 AI平台
  # 用户指定直连域名，优先于广告、隐私和其他远程规则。
  - RULE-SET,direct_domains,DIRECT
  # 本地和广告规则应放在其他服务规则之前。
  - RULE-SET,lan,DIRECT
  - RULE-SET,loya_private,DIRECT
  - RULE-SET,loya_reject,🛡️ 广告拦截
  - RULE-SET,privacy,🛡️ 广告拦截
  - RULE-SET,telegram,✈️X电报
  - RULE-SET,twitter,✈️X电报
  - RULE-SET,openai,🤖 AI平台
  - RULE-SET,claude,🤖 AI平台
  - RULE-SET,gemini,🤖 AI平台
  - RULE-SET,youtube,▶️YouTube
  - RULE-SET,spotify,🎵Spotify
  # Apple 服务直连，覆盖推送、登录、App Store 和 iCloud 等域名。
  - RULE-SET,apple_services,DIRECT
  # AWS 控制台和云服务域名优先于 amazon.com 电商后缀。
  - RULE-SET,aws_services,🛟 漏网之鱼
  - RULE-SET,amazon_shop,🛒Amazon电商
  - RULE-SET,wildberries,🇷🇺Wildberries电商
  # 国内域名和中国大陆 IP 默认直连。
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,🛟 漏网之鱼
