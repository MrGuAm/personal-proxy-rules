    interval: 86400
  loya_private:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"
    path: ./rule-providers/loyalsoldier-private.yaml
