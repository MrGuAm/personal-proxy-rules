    path: ./rule-providers/amazon-shopping.yaml
    interval: 86400
  wildberries:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/mihomo/wildberries.yaml"
    path: ./rule-providers/wildberries.yaml
    interval: 86400

rules:
  # 本地和广告规则应放在服务规则之前。
  - RULE-SET,lan,DIRECT
  - RULE-SET,loya_private,DIRECT
  - RULE-SET,loya_reject,🛑 广告拦截
  - RULE-SET,privacy,🛑 广告拦截
  - RULE-SET,telegram,通讯与社交
  - RULE-SET,twitter,通讯与社交
  - RULE-SET,openai,AI 服务
  - RULE-SET,claude,AI 服务
  - RULE-SET,gemini,AI 服务
  - RULE-SET,youtube,国外媒体
  - RULE-SET,spotify,国外音乐
  - RULE-SET,github,GitHub
  # Apple 服务按你的需求直连。
  - RULE-SET,apple,DIRECT
  # 自定义服务规则必须先于通用国内直连规则。
  - RULE-SET,aws,AWS
  - RULE-SET,amazon_shop,亚马逊跨境电商
  - RULE-SET,wildberries,俄罗斯野莓
  # Loyalsoldier 国内域名/IP规则。
  - RULE-SET,loya_direct,🎯 国内直连
  - RULE-SET,loya_cncidr,🎯 国内直连,no-resolve
  # Mihomo 地理数据作为兜底国内规则。
  - GEOSITE,cn,🎯 国内直连
  - GEOIP,CN,🎯 国内直连,no-resolve
  - MATCH,🐟 漏网之鱼
