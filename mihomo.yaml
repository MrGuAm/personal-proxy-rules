# Mihomo / Clash Party v1
# 这是给 SubStore 合并订阅节点后的主配置模板。
# GitHub: https://github.com/MrGuAm/personal-proxy-rules

mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
geodata-mode: true
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

proxy-groups:
  # ---------- 节点管理 ----------
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "♻️ 自动测速"
      - "🛠️ 手动选择"
      - "🇭🇰 香港节点"
      - "🇹🇼 台湾节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🇰🇷 韩国节点"
      - "🌐 其他地区"
      - DIRECT

  - name: "♻️ 自动测速"
    type: url-test
    include-all: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🛠️ 手动选择"
    type: select
    include-all: true
    exclude-filter: "(?i)(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)"

  - name: "🇭🇰 香港节点"
    type: url-test
    include-all: true
    filter: "(?i)(香港|港|HK|Hong ?Kong|HongKong)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇹🇼 台湾节点"
    type: url-test
    include-all: true
    filter: "(?i)(台湾|台|TW|Taiwan|Taipei|台北)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇯🇵 日本节点"
    type: url-test
    include-all: true
    filter: "(?i)(日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇸🇬 新加坡节点"
    type: url-test
    include-all: true
    filter: "(?i)(新加坡|狮城|SG|Singapore)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇺🇸 美国节点"
    type: url-test
    include-all: true
    filter: "(?i)(美国|美|US|USA|United ?States|America|洛杉矶|Los ?Angeles|纽约|New ?York)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🇰🇷 韩国节点"
    type: url-test
    include-all: true
    filter: "(?i)(韩国|韩|KR|Korea|Seoul|首尔)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  - name: "🌐 其他地区"
    type: url-test
    include-all: true
    exclude-filter: "(?i)(香港|港|HK|Hong ?Kong|HongKong|台湾|台|TW|Taiwan|Taipei|日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo|新加坡|狮城|SG|Singapore|美国|美|US|USA|United ?States|America|洛杉矶|Los ?Angeles|纽约|New ?York|韩国|韩|KR|Korea|Seoul|首尔|剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)"
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
    lazy: true

  # ---------- 服务策略 ----------
  - name: "通讯与社交"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动测速"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "AI 服务"
    type: select
    proxies:
      - "🚀 节点选择"
      - "🇺🇸 美国节点"
      - "♻️ 自动测速"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "国外媒体"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动测速"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "国外音乐"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动测速"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "GitHub"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动测速"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "AWS"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动测速"
      - "🇭🇰 香港节点"
      - "🇯🇵 日本节点"
      - "🇸🇬 新加坡节点"
      - "🇺🇸 美国节点"
      - "🛠️ 手动选择"
      - DIRECT

  - name: "亚马逊跨境电商"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "俄罗斯野莓"
    type: select
    proxies:
      - DIRECT
      - "🚀 节点选择"

  - name: "🛑 广告拦截"
    type: select
    # REJECT = 开启拦截；DIRECT = 关闭拦截
    proxies:
      - REJECT
      - DIRECT

  - name: "🎯 国内直连"
    type: select
    proxies:
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - "🚀 节点选择"
      - "♻️ 自动测速"
      - "🛠️ 手动选择"
      - DIRECT

rule-providers:
  lan:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Lan/Lan.yaml"
    path: ./rule-providers/lan.yaml
    interval: 86400
  loya_reject:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt"
    path: ./rule-providers/loyalsoldier-reject.yaml
    interval: 86400
  loya_direct:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt"
    path: ./rule-providers/loyalsoldier-direct.yaml
    interval: 86400
  loya_private:
    type: http
    behavior: domain
    format: yaml
    url: "https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/private.txt"
