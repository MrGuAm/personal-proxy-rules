    url: "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml"
    path: ./rule-providers/spotify.yaml
    interval: 86400
  apple_services:
    type: inline
    behavior: classical
    format: yaml
    payload:
      - DOMAIN-SUFFIX,apple.com
      - DOMAIN-SUFFIX,icloud.com
      - DOMAIN-SUFFIX,apple-cloudkit.com
      - DOMAIN-SUFFIX,mzstatic.com
  direct_domains:
    type: inline
    behavior: classical
    format: yaml
    payload:
      - DOMAIN-SUFFIX,zzone.cc.cd
  aws_services:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/mihomo/aws-services.yaml"
