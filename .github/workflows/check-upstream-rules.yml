name: Check upstream rules

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate Mihomo YAML
        run: ruby -e 'require "yaml"; YAML.load_file("mihomo.yaml"); Dir["rules/mihomo/*.yaml"].each { |file| YAML.load_file(file) }; puts "YAML validation passed"'

      - name: Check remote rule URLs
        shell: bash
        run: |
          set -euo pipefail
          sed -E '/^[[:space:]]*(#|;|\/\/)/d' mihomo.yaml quantumult-x.conf quantum-x-auto.conf \
            | grep -oE 'https://[^" ,]+' \
            | sed 's/[),].*$//' \
            | sort -u \
            | while IFS= read -r url; do
                echo "Checking $url"
                curl --fail --location --retry 6 --retry-all-errors --retry-delay 3 \
                  --connect-timeout 20 --max-time 120 \
                  --silent --show-error --output /dev/null "$url"
              done
