name: Update Quantumult X config

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and validate config
        run: python3 scripts/build_quantumultx.py quantumult-x.conf quantum-x-auto.conf

      - name: Commit generated config
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add quantum-x-auto.conf
          git diff --cached --quiet || git commit -m "chore: update Quantumult X config"
          git push
