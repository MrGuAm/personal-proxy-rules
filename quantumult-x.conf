https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Spotify/Spotify.list, tag=Spotify, force-policy=🎵Spotify, update-interval=86400

# Apple 服务直连；显式覆盖 4-courier.push.apple.com 等推送域名。
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/apple-services.list, tag=苹果服务直连, force-policy=direct, update-interval=86400

# 自定义规则：AWS 服务直连，并优先于 Amazon 电商规则。
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/aws-services.list, tag=AWS服务, force-policy=direct, update-interval=86400
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/amazon-shopping.list, tag=Amazon电商, force-policy=🛒Amazon电商, update-interval=86400
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/wildberries.list, tag=Wildberries电商, force-policy=🇷🇺Wildberries电商, update-interval=86400

# 中国大陆域名直连
