# Quantumult X v1
# GitHub: https://github.com/MrGuAm/personal-proxy-rules
# 节点名称由 SubStore/订阅本身提供；本文件负责策略组和远程分流。

[general]

[policy]
# 总代理入口
static=🚀 节点选择, ♻️ 自动测速, 🛠️ 手动选择, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🇰🇷 韩国节点, 🌐 其他地区, direct

# 全节点自动测速和手动选择
url-latency-benchmark=♻️ 自动测速, server-tag-regex=^(?!(?=.*(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组))).+$, check-url=http://www.gstatic.com/generate_204, interval=300
available=🛠️ 手动选择, server-tag-regex=^(?!(?=.*(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组))).+$

# 地区自动测速
url-latency-benchmark=🇭🇰 香港节点, server-tag-regex=^(?=.*(香港|港|HK|Hong ?Kong|HongKong)).+$, check-url=http://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇹🇼 台湾节点, server-tag-regex=^(?=.*(台湾|台|TW|Taiwan|Taipei|台北)).+$, check-url=http://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇯🇵 日本节点, server-tag-regex=^(?=.*(日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo)).+$, check-url=http://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇸🇬 新加坡节点, server-tag-regex=^(?=.*(新加坡|狮城|SG|Singapore)).+$, check-url=http://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇺🇸 美国节点, server-tag-regex=^(?=.*(美国|美|US|USA|United ?States|America|洛杉矶|Los ?Angeles|纽约|New ?York)).+$, check-url=http://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇰🇷 韩国节点, server-tag-regex=^(?=.*(韩国|韩|KR|Korea|Seoul|首尔)).+$, check-url=http://www.gstatic.com/generate_204, interval=300
available=🌐 其他地区, server-tag-regex=^(?!(?=.*(香港|港|HK|Hong ?Kong|HongKong|台湾|台|TW|Taiwan|Taipei|日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo|新加坡|狮城|SG|Singapore|美国|美|US|USA|United ?States|America|洛杉矶|Los ?Angeles|纽约|New ?York|韩国|韩|KR|Korea|Seoul|首尔|剩余|流量|套餐|到期|官网|客服|邀请|机场|群组))).+$

# 服务策略。默认跟随总代理入口。
static=通讯与社交, 🚀 节点选择, ♻️ 自动测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=AI 服务, 🚀 节点选择, 🇺🇸 美国节点, ♻️ 自动测速, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🛠️ 手动选择, direct
static=国外媒体, 🚀 节点选择, ♻️ 自动测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=国外音乐, 🚀 节点选择, ♻️ 自动测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=GitHub, 🚀 节点选择, ♻️ 自动测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=AWS, 🚀 节点选择, ♻️ 自动测速, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=亚马逊跨境电商, direct, 🚀 节点选择
static=俄罗斯野莓, direct, 🚀 节点选择
static=🛑 广告拦截, reject, direct
static=🎯 国内直连, direct
static=🐟 漏网之鱼, 🚀 节点选择, ♻️ 自动测速, 🛠️ 手动选择, direct

[filter_remote]
# 局域网
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Lan/Lan.list, tag=局域网, force-policy=direct, update-interval=86400

# 广告和隐私规则共用一个策略组；选择 direct 即关闭拦截。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/AdvertisingLite/AdvertisingLite.list, tag=广告规则, force-policy=🛑 广告拦截, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Privacy/Privacy.list, tag=隐私规则, force-policy=🛑 广告拦截, update-interval=86400

# 通讯与社交
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Telegram/Telegram.list, tag=Telegram, force-policy=通讯与社交, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Twitter/Twitter.list, tag=X, force-policy=通讯与社交, update-interval=86400

# AI 服务
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/OpenAI/OpenAI.list, tag=OpenAI, force-policy=AI 服务, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Claude/Claude.list, tag=Claude, force-policy=AI 服务, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Gemini/Gemini.list, tag=Gemini, force-policy=AI 服务, update-interval=86400

# 国外媒体、音乐、开发者服务
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/YouTube/YouTube.list, tag=YouTube, force-policy=国外媒体, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Spotify/Spotify.list, tag=Spotify, force-policy=国外音乐, update-interval=86400
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/GitHub/GitHub.list, tag=GitHub, force-policy=GitHub, update-interval=86400

# Apple 按你的需求直连。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/Apple/Apple.list, tag=Apple, force-policy=direct, update-interval=86400

# 自定义规则：AWS、Amazon 电商、Wildberries
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/aws.list, tag=AWS, force-policy=AWS, update-interval=86400
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/amazon-shopping.list, tag=亚马逊跨境电商, force-policy=亚马逊跨境电商, update-interval=86400
https://raw.githubusercontent.com/MrGuAm/personal-proxy-rules/main/rules/quantumult-x/wildberries.list, tag=Wildberries, force-policy=俄罗斯野莓, update-interval=86400

# 中国大陆域名规则放在服务规则之后，但在最终规则之前。
https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/QuantumultX/ChinaMax/ChinaMax.list, tag=中国大陆, force-policy=🎯 国内直连, update-interval=86400

[filter_local]
# IP 和未命中规则兜底。
ip-cidr, 10.0.0.0/8, direct
ip-cidr, 172.16.0.0/12, direct
ip-cidr, 192.168.0.0/16, direct
ip-cidr, 127.0.0.0/8, direct
ip6-cidr, fc00::/7, direct
geoip, cn, 🎯 国内直连
final, 🐟 漏网之鱼
