# Quantumult X v1
# GitHub: https://github.com/MrGuAm/personal-proxy-rules
# 节点名称由 SubStore/订阅本身提供；本文件负责策略组和远程分流。

[general]

[policy]
# 🚀 节点管理
static=🚀 节点选择, ♻️ 自动选择, 🛠️ 手动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, ☁️ AWS亚马逊服务器节点, direct

# ♻️ 全节点自动测速和 🛠️ 手动选择
url-latency-benchmark=♻️ 自动选择, server-tag-regex=^(?!.*(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)).*$, check-url=https://www.gstatic.com/generate_204, interval=300
available=🛠️ 手动选择, server-tag-regex=^(?!.*(剩余|流量|套餐|到期|官网|客服|邀请|机场|群组)).*$

# 地区自动测速
url-latency-benchmark=☁️ AWS亚马逊服务器节点, server-tag-regex=.*(AWS|亚马逊|Amazon).*, check-url=https://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇺🇸 美国节点, server-tag-regex=.*(美国|美|US|USA|United ?States|America|洛杉矶|Los ?Angeles|纽约|New ?York|Ohio|Oregon).*, check-url=https://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇯🇵 日本节点, server-tag-regex=.*(日本|日|JP|Japan|东京|東京|大阪|Osaka|Tokyo).*, check-url=https://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇸🇬 新加坡节点, server-tag-regex=.*(新加坡|狮城|SG|Singapore).*, check-url=https://www.gstatic.com/generate_204, interval=300
url-latency-benchmark=🇭🇰 香港节点, server-tag-regex=.*(香港|港|HK|Hong ?Kong|HongKong).*, check-url=https://www.gstatic.com/generate_204, interval=300

# 服务策略
static=🤖 AI平台, 🇺🇸 美国节点, 🚀 节点选择, ♻️ 自动选择, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🛠️ 手动选择, direct
static=🇷🇺Wildberries电商, direct, 🚀 节点选择
static=🛒Amazon电商, direct, 🚀 节点选择
static=✈️X电报, 🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=▶️YouTube, 🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=🎵Spotify, 🚀 节点选择, ♻️ 自动选择, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, 🛠️ 手动选择, direct
static=🛡️ 广告拦截, reject, direct
static=🛟 漏网之鱼, 🚀 节点选择, ♻️ 自动选择, 🛠️ 手动选择, direct
[filter_remote]
# 局域网
